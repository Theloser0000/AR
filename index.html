<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EWBS Farewell AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #msg{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      background:#001b44;
      color:white;
      padding:10px 16px;
      border-radius:8px;
      font-family:sans-serif;
      z-index:999;
    }
  </style>
</head>
<body>

<div id="msg">Point camera at the EWBS marker</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker id="marker" type="pattern" url="./pattern-marker.patt"></a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
const marker = document.getElementById("marker");
const msg = document.getElementById("msg");

marker.addEventListener("markerFound", () => {
  msg.innerText = "Marker detected! Opening video...";
  setTimeout(() => {
    window.open("./farewell.mp4", "_blank");
  }, 500);
});

marker.addEventListener("markerLost", () => {
  msg.innerText = "Point camera at the EWBS marker";
});
</script>

</body>
</html>
