<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Farewell AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin:0; overflow:hidden; }
  </style>
</head>

<body>

<a-scene embedded arjs>

  <a-assets>
    <video
      id="farewellVideo"
      src="farewell.mp4"
      preload="auto"
      loop="false"
      crossorigin="anonymous"
      webkit-playsinline
      playsinline>
    </video>
  </a-assets>

  <a-marker type="pattern" url="pattern-marker.patt">

    <a-video
      src="#farewellVideo"
      width="2"
      height="1.2"
      position="0 0.5 0">
    </a-video>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
window.onload = () => {
  document.querySelector('a-marker')
    .addEventListener('markerFound', () => {
      document.getElementById('farewellVideo').play();
    });

  document.querySelector('a-marker')
    .addEventListener('markerLost', () => {
      document.getElementById('farewellVideo').pause();
    });
};
</script>

</body>
</html>
