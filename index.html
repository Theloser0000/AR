<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EWBS Farewell AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <video
      id="farewellVideo"
      src="./farewell.mp4"
      preload="auto"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-marker
    type="pattern"
    url="./pattern-marker.patt">

    <a-video
      src="#farewellVideo"
      width="2"
      height="1.2"
      position="0 0.5 0"
      rotation="-90 0 0">
    </a-video>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
window.addEventListener("click", function () {
  const video = document.getElementById("farewellVideo");

  if (video) {
    video.play().catch(function(e) {
      console.log(e);
    });
  }
});
</script>

</body>
</html>
